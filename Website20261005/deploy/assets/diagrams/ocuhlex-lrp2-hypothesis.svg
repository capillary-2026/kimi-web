<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 450" role="img" aria-labelledby="title desc"><title id="title">Working hypothesis: candidate RPE interactions</title><desc id="desc">An abstract albumin-associated symbol lies on the retina-facing side of an RPE barrier. A dashed path with a question mark represents investigation of LRP2/megalin and cubilin–amnionless involvement. This is preliminary internal evidence and in-vivo causality is not established. The retina itself is omitted from this barrier zoom; no receptor structure, cargo identity or proven transcytosis is depicted.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173247}.label{font-size:20px}.small{font-size:17px;fill:#475d70}</style><defs><g id="biologic"><path d="M-28 0C-26-20-3-31 16-17C35-5 35 16 15 25C-5 34-31 21-28 0Z" fill="#176b91"/><path d="M-13-9Q2-18 18-4M-15 5Q0 17 18 8" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/></g><g id="albumin"><path d="M-46 4C-61-15-40-40-19-33C-7-51 21-41 25-22C52-20 60 8 43 27C25 48 2 38-4 30C-30 46-55 26-46 4Z" fill="#e4f4f2" stroke="#238b98" stroke-width="2"/><path d="M-30-14Q-14-28 1-12T30 2M-31 15Q-15 4 1 19T28 20" stroke="#238b98" stroke-opacity=".5" stroke-width="1.5" fill="none"/></g></defs><rect x="1" y="1" width="498" height="448" rx="6" fill="#f4f8fb"/><text class="label" x="26" y="39">Working hypothesis</text><text class="small" x="26" y="75">Retina-facing side</text><text class="small" x="307" y="75">Choroid-facing side</text><g fill="#e4f2ef" stroke="#98c2be"><rect x="225" y="105" width="75" height="98" rx="12"/><rect x="225" y="208" width="75" height="98" rx="12"/></g><g fill="#98c2be"><ellipse cx="261" cy="139" rx="11" ry="7"/><ellipse cx="261" cy="278" rx="11" ry="7"/></g><text class="label" x="261" y="335" text-anchor="middle">RPE layer</text><use href="#biologic" transform="translate(69 159) scale(.5)"/><use href="#albumin" transform="translate(147 159) scale(.5)"/><path d="M86 159H116" stroke="#176b91" stroke-dasharray="3 4"/><text class="small" x="25" y="223">Albumin-associated</text><text class="small" x="25" y="245">species (concept)</text><path d="M183 160C210 160 206 231 250 232H414" stroke="#67879a" stroke-width="2" stroke-dasharray="5 6" fill="none"/><circle cx="350" cy="232" r="19" fill="#fff" stroke="#67879a" stroke-dasharray="3 4"/><text x="350" y="240" text-anchor="middle" font-size="25">?</text><text class="small" x="322" y="289">Candidate pathway</text><text class="small" x="322" y="310">under investigation</text><path d="M25 357H475" stroke="#dce6ed"/><text class="small" x="26" y="392">LRP2 / megalin and cubilin–amnionless</text><text class="small" x="26" y="422">In-vivo causal transport is not established.</text></svg>