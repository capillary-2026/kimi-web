<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 410" role="img" aria-labelledby="title desc"><title id="title">Exposure-evaluation compartments</title><desc id="desc">Simplified enlarged posterior eye tissues, ordered from vitreous to retina, RPE and choroid. Residence is evaluated in the vitreous; exposure is evaluated in posterior tissues. No drug path is depicted. Not to scale.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173247}.label{font-size:20px;font-weight:500}.small{font-size:16px;fill:#475d70}</style><defs><linearGradient id="vit"><stop stop-color="#fff"/><stop offset="1" stop-color="#dcecf3"/></linearGradient><linearGradient id="ret"><stop stop-color="#f8f3ef"/><stop offset="1" stop-color="#e7d1c6"/></linearGradient><linearGradient id="chor"><stop stop-color="#ead8d2"/><stop offset="1" stop-color="#f5e9e2"/></linearGradient></defs><text class="label" x="68" y="45" text-anchor="middle">Vitreous</text><text class="label" x="194" y="45" text-anchor="middle">Retina</text><text class="label" x="286" y="45" text-anchor="middle">RPE</text><text class="label" x="391" y="45" text-anchor="middle">Choroid</text><g transform="translate(15 70)"><rect width="110" height="250" rx="8" fill="url(#vit)"/><rect x="110" width="126" height="250" fill="url(#ret)"/><rect x="236" width="70" height="250" fill="#d3e8e6"/><rect x="306" width="144" height="250" rx="8" fill="url(#chor)"/><path d="M128 15.0v34.166666666666664m28-34.166666666666664v34.166666666666664m28-34.166666666666664v34.166666666666664" stroke="#c9a99c" stroke-width="3" opacity=".7"/><rect x="244" y="15.0" width="54" height="34.166666666666664" rx="8" fill="#e4f2ef" stroke="#98c2be"/><ellipse cx="271.0" cy="32.08333333333333" rx="8" ry="5" fill="#8bb9b3"/><path d="M128 51.666666666666664v34.166666666666664m28-34.166666666666664v34.166666666666664m28-34.166666666666664v34.166666666666664" stroke="#c9a99c" stroke-width="3" opacity=".7"/><rect x="244" y="51.666666666666664" width="54" heig