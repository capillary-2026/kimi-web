<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc"><title id="title">Two ocular exposure objectives</title><desc id="desc">An eye cross-section locates the vitreous and the posterior region. An enlarged schematic places vitreous, retina, retinal pigment epithelium and choroid in order. These are exposure-evaluation compartments. No drug movement, receptor mechanism or measured outcome is shown. Anatomy is simplified and not to scale.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173247}.label{font-size:20px;font-weight:500}.small{font-size:16px;fill:#475d70}</style><defs><linearGradient id="vit"><stop stop-color="#fff"/><stop offset="1" stop-color="#dcecf3"/></linearGradient><linearGradient id="ret"><stop stop-color="#f8f3ef"/><stop offset="1" stop-color="#e7d1c6"/></linearGradient><linearGradient id="chor"><stop stop-color="#ead8d2"/><stop offset="1" stop-color="#f5e9e2"/></linearGradient></defs><g transform="translate(210 210)"><path d="M-129 0C-128-102-39-156 52-139C146-121 186-43 163 40C142 119 64 157-16 143C-89 130-131 73-129 0Z" fill="url(#vit)" stroke="#67879a" stroke-width="2"/><path d="M-129-38Q-166 0-129 42" stroke="#67879a" stroke-width="2" fill="#fff"/><ellipse cx="-106" cy="0" rx="15" ry="48" fill="#fff" stroke="#93aab8" stroke-width="2"/><path d="M85-124C174-81 193 72 97 126" fill="none" stroke="#d1a995" stroke-width="11"/><path d="M81-120C164-76 181 70 91 119" fill="none" stroke="#238b98" stroke-width="4"/><ellipse cx="20" cy="0" rx="89" ry="90" stroke="#91b9c6" stroke-dasharray="5 6" fill="none"/><text class="label" x="12" y="7" text-anchor="middle">Vitreous</text></g><path d="M364 106L575 82M365 314L575 350" fill="none" stroke="#b6c8d1" stroke-dasharray="5 5"/><text class="small" x="447" y="208" text-anchor="middle">Posterior</text><text class="small" x="447" y="230" text-anchor="middle">region enlarged</text><g transform="translate(575 80)"><rect width="165" height="280" rx="8" fi