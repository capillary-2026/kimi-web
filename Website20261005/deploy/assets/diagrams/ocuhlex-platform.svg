<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc"><title id="title">Molecule and formulation, designed together</title><desc id="desc">Abstract biologic and albumin symbols, free species and reversibly associated species connected by bidirectional equilibrium. Noncovalent association is represented by a dashed mark. No molecular geometry, domain count or fixed binding ratio is represented.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173247}.heading{font-size:22px;font-weight:500}.label{font-size:18px}.small{font-size:16px;fill:#475d70}</style><defs><g id="biologic"><path d="M-28 0C-26-20-3-31 16-17C35-5 35 16 15 25C-5 34-31 21-28 0Z" fill="#176b91"/><path d="M-13-9Q2-18 18-4M-15 5Q0 17 18 8" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/></g><g id="albumin"><path d="M-46 4C-61-15-40-40-19-33C-7-51 21-41 25-22C52-20 60 8 43 27C25 48 2 38-4 30C-30 46-55 26-46 4Z" fill="#e4f4f2" stroke="#238b98" stroke-width="2"/><path d="M-30-14Q-14-28 1-12T30 2M-31 15Q-15 4 1 19T28 20" stroke="#238b98" stroke-opacity=".5" stroke-width="1.5" fill="none"/></g></defs><path d="M515 20V278" stroke="#dce6ed"/><text class="heading" x="20" y="36">Molecule and formulation</text><use href="#biologic" transform="translate(120 131) scale(1.25)"/><use href="#albumin" transform="translate(347 131) scale(1.15)"/><text class="label" x="120" y="218" text-anchor="middle">Engineered biologic</text><text class="label" x="347" y="218" text-anchor="middle">Pharmaceutical HSA</text><text class="small" x="20" y="276">Binding function and formulation are developed together.</text><text class="heading" x="558" y="36">Reversible, noncovalent association</text><use href="#biologic" transform="translate(610 134) scale(.85)"/><use href="#albumin" transform="translate(700 134) scale(.75)"/><path d="M776 123H861l-12-11m12 11-12 11M861 147H776l12-11m-12 11 12 11" fill="none" stroke="#173247" stroke-width="2"/><use href="#biologic" transform="translate(952 134) scale(.85)"/><use href="#albumin" transform="translate(1080 134) scale(.75)"/><path d="M987 134H1035" fill="none" stroke="#176b91" stroke-width="2" stroke-dasharray="4 5"/><text class="label" x="656" y="218" text-anchor="middle">Free species</text><text class="label" x="1016" y="218" text-anchor="middle">Associated species</text><text class="small" x="558" y="276">A dynamic population, rather than a fixed molecular entity.</text></svg>