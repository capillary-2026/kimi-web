<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" role="img" aria-labelledby="title desc"><title id="title">OcuHLE-X: molecule, reversible association and ocular exposure evaluation</title><desc id="desc">Concept schematic, not to scale. Abstract symbols do not depict molecular structure or fixed stoichiometry. Reversible albumin association is separate from evaluation of vitreous residence and posterior-tissue exposure. No clinical outcome or transport pathway is represented.</desc><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173247}.heading{font-size:20px;font-weight:500}.label{font-size:15px}.small{font-size:13px;fill:#475d70}.micro{font-size:12px;fill:#475d70}</style><defs><g id="biologic"><path d="M-28 0C-26-20-3-31 16-17C35-5 35 16 15 25C-5 34-31 21-28 0Z" fill="#176b91"/><path d="M-13-9Q2-18 18-4M-15 5Q0 17 18 8" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.5"/></g><g id="albumin"><path d="M-46 4C-61-15-40-40-19-33C-7-51 21-41 25-22C52-20 60 8 43 27C25 48 2 38-4 30C-30 46-55 26-46 4Z" fill="#e4f4f2" stroke="#238b98" stroke-width="2"/><path d="M-30-14Q-14-28 1-12T30 2M-31 15Q-15 4 1 19T28 20" stroke="#238b98" stroke-opacity=".5" stroke-width="1.5" fill="none"/></g></defs><path d="M355 20V310M815 20V310" fill="none" stroke="#dce6ed"/>
<g id="molecule-scene"><text class="heading" x="24" y="42">Molecule + formulation</text><use href="#biologic" transform="translate(98 138) rotate(-15)"/><use href="#albumin" transform="translate(245 138)"/><text class="label" x="32" y="210">Engineered biologic</text><text class="label" x="192" y="210">Albumin (HSA)</text><text class="small" x="24" y="260">Molecular design and pharmaceutical</text><text class="small" x="24" y="280">albumin formulation, developed together.</text></g>
<g id="association-scene"><text class="heading" x="385" y="42">Reversible association</text><use href="#biologic" transform="translate(440 132) scale(.8)"/><use href="#albumin" transform="translate(514 134) scale(.7)"/><path d="M563 123H622l-9-8m9 8-9 8M622 145H563l9-8m-9 8 9 8" fill="none" stroke="#173247" stroke-width="2"/><use href="#albumin" transform="translate(750 138) scale(.7)"/><use href="#biologic" transform="translate(658 138) scale(.65)"/><path d="M680 138H707" fill="none" stroke="#176b91" stroke-width="1.5" stroke-dasharray="3 3"/><text class="label" x="419" y="210">Free species</text><text class="label" x="645" y="210">Associated species</text><text class="small" x="385" y="260">A dynamic population of free and</text><text class="small" x="385" y="280">reversibly associated species.</text></g>
